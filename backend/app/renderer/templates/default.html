<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ stylesheet_url }}" />
  </head>
  <body>
    <main class="document-shell">
      <header class="cover-page">
        <div class="cover-mark">PaperChat</div>
        <div class="cover-copy">
          <p class="eyebrow">{{ platform }}</p>
          <h1>{{ title }}</h1>
          <p class="subtitle">{{ subtitle }}</p>
        </div>
        <dl class="cover-stats">
          {{ cover_stats }}
        </dl>
        <p class="cover-footer">Generated by PaperChat</p>
      </header>

      <section class="front-matter" aria-label="Document information">
        <section class="metadata-card" aria-labelledby="metadata-title">
          <div class="section-kicker">Overview</div>
          <h2 id="metadata-title">Document Details</h2>
          <dl class="metadata-grid">
            {{ metadata }}
          </dl>
        </section>

        <nav class="toc" aria-label="Table of contents">
          <div class="section-kicker">Navigation</div>
          <h2>Contents</h2>
          {{ toc }}
        </nav>
      </section>

      <section class="conversation" aria-label="Document body">
        <div class="section-kicker">Main Document</div>
        {{ body }}
      </section>
    </main>
  </body>
</html>
